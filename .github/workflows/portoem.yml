name: Porting OEM
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "Direct APK download link (ex: https://link.example/file.apk)"
        required: true
        type: string

      apk_name:
        description: "Output APK name (ex: OplusCalculator)"
        required: true
        type: string

      patch:
        description: "Patch Type (ex: samsung,oneplus,moto,xiaomi,oppo)"
        required: true
        type: string

      run_id:
        description: "Release ID (ex: oppocalculator-cos17)"
        required: true
        type: string

      ai:
        description: "Extra: AI smali review of injected classes (true/false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet apktool zipalign apksigner

      - name: Download source APK
        env:
          APK_LINK: ${{ inputs.apk_link }}
        run: |
          set -euo pipefail

          APK_PATH="$GITHUB_WORKSPACE/input.apk"

          echo "Downloading APK from direct link..."

          curl -fSL \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$APK_LINK" \
            -o "$APK_PATH"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK download failed or the file is empty."
            exit 1
          fi

          echo "APK downloaded successfully."
          ls -lh "$APK_PATH"

      - name: Run port and enforce Smali fixes
        env:
          PATCH_NAME: ${{ inputs.patch }}
          AI_INPUT: ${{ inputs.ai }}
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          set -euo pipefail

          PORT_ARGS=()
          if [ "$AI_INPUT" = "true" ]; then
            echo "AI smali review: ON"
            PORT_ARGS+=(--ai)
          else
            echo "AI smali review: OFF"
          fi

          # 1. Run standard AppsPorter build
          bash build_port.sh input.apk "$PATCH_NAME" "${PORT_ARGS[@]}"

          PORTED_APK="$GITHUB_WORKSPACE/out/input_ported.apk"
          if [ ! -s "$PORTED_APK" ]; then
            echo "::error::Ported APK not found at $PORTED_APK"
            exit 1
          fi

          # 2. Directly unpack the ported APK (smali only, skip resources with -r) to guarantee patch application
          echo "=== Unpacking ported DEX files to patch Samsung AccessibilityManager calls ==="
          APKTOOL_JAR=$(find "$GITHUB_WORKSPACE" -name "apktool*.jar" | head -n 1 || true)
          WORK_DIR="$GITHUB_WORKSPACE/smali_fix_tmp"
          rm -rf "$WORK_DIR"

          if [ -n "$APKTOOL_JAR" ]; then
            java -jar "$APKTOOL_JAR" d -r -f "$PORTED_APK" -o "$WORK_DIR"
          else
            apktool d -r -f "$PORTED_APK" -o "$WORK_DIR"
          fi

          echo "=== Searching for semIsScreenReaderEnabled in Smali ==="
          grep -rn "semIsScreenReaderEnabled" "$WORK_DIR" || echo "No raw matches found before sed."

          # Replace semIsScreenReaderEnabled()Z with standard AOSP isTouchExplorationEnabled()Z
          find "$WORK_DIR" -type f -name "*.smali" -exec sed -i \
            's/semIsScreenReaderEnabled()Z/isTouchExplorationEnabled()Z/g' {} +

          echo "=== Verifying replacement ==="
          if grep -rn "semIsScreenReaderEnabled" "$WORK_DIR"; then
            echo "::error::Failed to replace semIsScreenReaderEnabled!"
            exit 1
          else
            echo "Successfully replaced all instances with isTouchExplorationEnabled()Z"
          fi

          # 3. Rebuild the patched APK
          UNSIGNED_APK="$GITHUB_WORKSPACE/out/unsigned_patched.apk"
          ALIGNED_APK="$GITHUB_WORKSPACE/out/aligned_patched.apk"

          if [ -n "$APKTOOL_JAR" ]; then
            java -jar "$APKTOOL_JAR" b "$WORK_DIR" -o "$UNSIGNED_APK"
          else
            apktool b "$WORK_DIR" -o "$UNSIGNED_APK"
          fi

          # 4. Zipalign and Re-sign the APK
          zipalign -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          PK8_FILE=$(find "$GITHUB_WORKSPACE/keys" -name "*.pk8" | head -n 1 || true)
          PEM_FILE=$(find "$GITHUB_WORKSPACE/keys" -name "*.x509.pem" | head -n 1 || true)

          if [ -n "$PK8_FILE" ] && [ -n "$PEM_FILE" ]; then
            echo "Signing with repo AOSP keys: $PK8_FILE"
            apksigner sign --key "$PK8_FILE" --cert "$PEM_FILE" --out "$PORTED_APK" "$ALIGNED_APK"
          else
            echo "Generating temporary debug key for signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            apksigner sign --ks debug.keystore --ks-pass pass:android --out "$PORTED_APK" "$ALIGNED_APK"
          fi

          rm -rf "$WORK_DIR" "$UNSIGNED_APK" "$ALIGNED_APK"
          echo "=== Custom Smali patching and re-signing complete! ==="

      - name: Verify and Rename APK
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail

          APK_PATH="$GITHUB_WORKSPACE/out/input_ported.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Ported APK not found or empty: $APK_PATH"
            exit 1
          fi

          APK_NAME="${APK_NAME%.apk}"
          APK_NAME="$(echo "$APK_NAME" | xargs)"

          if [[ ! "$APK_NAME" =~ ^[a-zA-Z0-9._-]+$ ]] || \
             [ "$APK_NAME" = "." ] || \
             [ "$APK_NAME" = ".." ] || \
             [ -z "$APK_NAME" ]; then
            echo "::error::Invalid APK name."
            exit 1
          fi

          NEW_APK_PATH="$GITHUB_WORKSPACE/out/${APK_NAME}.apk"

          if [ "$APK_PATH" != "$NEW_APK_PATH" ]; then
            mv "$APK_PATH" "$NEW_APK_PATH"
          fi

          echo "APK verified and renamed successfully: $NEW_APK_PATH"

      - name: Upload APK and Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}-ported-apk
          path: |
            ${{ github.workspace }}/out/*.apk
            ${{ github.workspace }}/out/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Send Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_ID: ${{ inputs.run_id }}
          PATCH_NAME: ${{ inputs.patch }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping Discord notification."
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "content": "✅ **OEM App Port Completed!**",
            "embeds": [{
              "title": "Build: $RELEASE_ID",
              "color": 3066993,
              "description": "The **$PATCH_NAME** patch + custom Smali fixes have been applied.\n\n📥 **[Download the Artifacts Here]($RUN_URL)**",
              "footer": {
                "text": "AppsPorter GitHub Actions"
              }
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON_PAYLOAD" \
               "$DISCORD_WEBHOOK"
