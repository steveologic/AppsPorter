name: Porting OEM Apps
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "Direct APK download link (ex: https://link.example/file.apk)"
        required: true
        type: string

      apk_name:
        description: "Output APK name (ex: OplusCalculator)"
        required: true
        type: string

      patch:
        description: "Patch Type (ex: samsung,oneplus,moto,xiaomi,oppo)"
        required: true
        type: string

      run_id:
        description: "Release ID (ex: oppocalculator-cos17)"
        required: true
        type: string

      ai:
        description: "Extra: AI smali review of injected classes (true/false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Download source APK
        env:
          APK_LINK: ${{ inputs.apk_link }}
        run: |
          set -euo pipefail

          APK_PATH="$GITHUB_WORKSPACE/input.apk"

          echo "Downloading APK from direct link..."

          curl -fSL \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$APK_LINK" \
            -o "$APK_PATH"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK download failed or the file is empty."
            exit 1
          fi

          echo "APK downloaded successfully."
          ls -lh "$APK_PATH"

      - name: Run port
        env:
          PATCH_NAME: ${{ inputs.patch }}
          AI_INPUT: ${{ inputs.ai }}
          # optional: set a repo variable AI_API_URL to use another endpoint
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          set -euo pipefail

          # Create a helper script to patch Samsung-specific AccessibilityManager calls
          cat << 'EOF' > fix_samsung_smali.sh
          echo "Applying custom Smali patch for semIsScreenReaderEnabled..."
          find . -type f -name "*.smali" -exec sed -i \
            's/Landroid\/view\/accessibility\/AccessibilityManager;->semIsScreenReaderEnabled()Z/Landroid\/view\/accessibility\/AccessibilityManager;->isTouchExplorationEnabled()Z/g' {} +
          EOF
          chmod +x fix_samsung_smali.sh

          # Inject the helper script into build_port.sh right before apktool rebuilds the APK
          sed -i '/apktool.* b /i bash "$GITHUB_WORKSPACE/fix_samsung_smali.sh"' build_port.sh

          PORT_ARGS=()
          if [ "$AI_INPUT" = "true" ]; then
            echo "AI smali review: ON"
            PORT_ARGS+=(--ai)
          else
            echo "AI smali review: OFF"
          fi

          bash build_port.sh input.apk "$PATCH_NAME" "${PORT_ARGS[@]}"

      - name: Verify and Rename APK
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail

          echo "Searching for generated APK files..."
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          APK_PATH="$GITHUB_WORKSPACE/out/input_ported.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Ported APK not found or empty: $APK_PATH"
            exit 1
          fi

          APK_NAME="${APK_NAME%.apk}"
          APK_NAME="$(echo "$APK_NAME" | xargs)"

          if [[ ! "$APK_NAME" =~ ^[a-zA-Z0-9._-]+$ ]] || \
             [ "$APK_NAME" = "." ] || \
             [ "$APK_NAME" = ".." ] || \
             [ -z "$APK_NAME" ]; then
            echo "::error::Invalid APK name."
            echo "Use only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi

          NEW_APK_PATH="$GITHUB_WORKSPACE/out/${APK_NAME}.apk"

          if [ "$APK_PATH" != "$NEW_APK_PATH" ]; then
            mv "$APK_PATH" "$NEW_APK_PATH"
          fi

          echo "APK verified and renamed successfully."
          echo "Output: $NEW_APK_PATH"
          echo "Size: $(du -h "$NEW_APK_PATH" | cut -f1)"

      - name: Upload APK and Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}-ported-apk
          path: |
            ${{ github.workspace }}/out/*.apk
            ${{ github.workspace }}/out/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Send Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_ID: ${{ inputs.run_id }}
          PATCH_NAME: ${{ inputs.patch }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping Discord notification."
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          # Construct the Discord message payload
          JSON_PAYLOAD=$(cat <<EOF
          {
            "content": "✅ **OEM App Port Completed!**",
            "embeds": [{
              "title": "Build: $RELEASE_ID",
              "color": 3066993,
              "description": "The **$PATCH_NAME** patch has been successfully applied to the APK.\n\n📥 **[Download the Artifacts Here]($RUN_URL)**",
              "footer": {
                "text": "AppsPorter GitHub Actions"
              }
            }]
          }
          EOF
          )

          # Send the webhook request
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON_PAYLOAD" \
               "$DISCORD_WEBHOOK"
